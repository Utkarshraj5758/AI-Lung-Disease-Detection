name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Older bundled pips fall back to building some torch dependencies from source.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU-only PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package
        run: python -m pip install -e ".[dev,api]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest --cov=lungxray --cov=api --cov-report=term-missing --cov-fail-under=80
